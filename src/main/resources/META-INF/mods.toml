modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/skua/createrailsprawl/issues"

[[mixins]]
config="createrailsprawl.mixins.json"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.createrailsprawl]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.createrailsprawl]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# Create Mod 依赖 - 向下兼容所有 1.20.1 版本
# 支持 Create 5.1.0 及以上所有版本
[[dependencies.createrailsprawl]]
    modId="create"
    mandatory=true
    versionRange="[5.1.0,)"
    ordering="AFTER"
    side="BOTH"
